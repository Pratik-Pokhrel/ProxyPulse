#this runs on OpenResty (nginx + LuaJIT bundled in)

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $upstream_addr [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" rt=$request_time';

    access_log /usr/local/openresty/nginx/logs/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # cache zone used by the "hot" endpoint, this is what lets nginx answer some requests without ever touching the backend
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=hot_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # rate limit zone keyed by client IP, 20k requests per second baseline - rate can be adjusted as per the backend capacity and need
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20000r/s;

    lua_shared_dict healthcheck 1m;

    # this is the main nginx config file, it includes all the other files in conf.d/ which is where the actual server {} block is defined
    include conf.d/*.conf;
}
